<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三国杀 AI 对战</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app">
  <header>
    <h1>三国杀 AI 对战</h1>
    <div id="controls">
      <button id="btn-start" onclick="startGame()">开始游戏</button>
      <button id="btn-step" onclick="doStep()" disabled>下一步</button>
      <label class="toggle">
        <input type="checkbox" id="chk-auto" onchange="toggleAuto(this.checked)" checked> 自动
      </label>
      <select id="sel-model" style="font-family:inherit;font-size:13px;padding:3px 6px;border-radius:4px;background:#1a1a2e;color:#e0e0e0;border:1px solid #0f3460;">
        <option value="deepseek-v4-flash" selected>DeepSeek V4 Flash</option>
        <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
        <option value="claude-sonnet-4-6">Claude Sonnet 4.6</option>
        <option value="random">随机AI (测试)</option>
      </select>
      <label class="toggle">
        <input type="checkbox" id="chk-god" checked onchange="toggleGod(this.checked)"> 上帝视角
      </label>
      <span id="status">就绪</span>
      <span id="await-indicator" style="display:none;color:#f59e0b;font-size:13px;margin-left:8px;"></span>
    </div>
  </header>

  <main>
    <aside id="player-panel">
      <div id="players"></div>
    </aside>

    <section id="log-panel">
      <div id="turn-info">
        <span id="turn-label">等待开始...</span>
      </div>
      <div id="event-log"></div>
    </section>
  </main>
</div>

<script src="/static/game.js"></script>
</body>
</html>
